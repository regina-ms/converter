version: '3.8'

services:
  app:
    build: .
    container_name: my-nextjs-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Монтируем папку uploads с VM внутрь контейнера
      # Левая часть — путь на VM, правая — внутри контейнера
      - /home/deployer/my-app/uploads:/app/uploads
    environment:
      - NODE_ENV=production