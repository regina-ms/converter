name: Deploy to Production

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Prepare server infrastructure
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # === Создаём рабочую директорию ===
            mkdir -p /var/www/myapp
            cd /var/www/myapp
            
            # === Проверяем/создаём .env файл ===
            if [ ! -f .env ]; then
              echo "NODE_ENV=production" > .env
              echo "✓ Created new .env file"
            fi
            
            # === Создаём/обновляем docker-compose.yml ===
            cat > docker-compose.yml << 'EOF'
            version: '3.8'
            
            services:
              app:
                image: ghcr.io/regina-ms/converter:latest
                container_name: nextjs_app
                restart: unless-stopped
                ports:
                  - "127.0.0.1:3000:3000"
                env_file:
                  - .env
                volumes:
                  - ./uploads:/app/uploads:rw
            EOF
            echo "✓ docker-compose.yml ready"
            
            # === Создаём папку uploads на хосте ===
            mkdir -p uploads
            echo "✓ uploads directory ready"
            echo "→ Infrastructure prepared successfully"

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/myapp
            
            echo "→ Pulling image: ghcr.io/regina-ms/converter:latest"
            docker compose pull app
            
            echo "→ Starting container..."
            docker compose up -d --no-deps app
            sleep 5
            
            if docker ps | grep -q "nextjs_app"; then
              echo "✓ Container is running"
              echo "→ Recent logs:"
              docker compose logs --tail=3 app
            else
              echo "✗ Container failed to start!"
              echo "→ Error logs:"
              docker compose logs app
              exit 1  # Прерываем workflow с ошибкой
            fi
            
            if docker exec nextjs_app ls -la /app/uploads > /dev/null 2>&1; then
              echo "✓ Uploads directory accessible in container"
              docker exec nextjs_app ls -la /app | grep uploads
            else
              echo "⚠ Warning: uploads directory not accessible (will be created on first upload)"
            fi
            
            docker image prune -af --filter "until=168h"
            echo "✓ Cleaned old images (older than 7 days)"
            
            echo ""
            echo "🚀 Deployment completed successfully!"
            echo "PR: #${{ github.event.pull_request.number || 'manual' }}"
            echo "Image: ghcr.io/regina-ms/converter:latest"